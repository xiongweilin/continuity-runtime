name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: continuity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d continuity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTINUITY_TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/continuity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,dbos]'
      - run: CONTINUITY_DATABASE_URL=$CONTINUITY_TEST_POSTGRES_URL alembic upgrade head
      - run: python -m compileall -q src examples
      - run: python -m ruff check --select E4,E7,E9,F src tests examples
      - run: python -m pytest -q
      - run: continuity demo
      - run: python examples/canary_guarded_handoff.py
      - run: docker build -t continuity-runtime:test .
      - name: Compose integration smoke test
        env:
          POSTGRES_PASSWORD: ci_local_database_pass
          CONTINUITY_TOKENS_JSON: '{"ci-admin":{"actor":"ci-root","admin":true},"ci-agent":{"actor":"ci-agent"}}'
        run: |
          docker compose up --build -d --wait
          python scripts/smoke_compose.py
      - name: Remove test containers and persistent volumes
        if: always()
        env:
          POSTGRES_PASSWORD: ci_local_database_pass
          CONTINUITY_TOKENS_JSON: '{"ci-admin":{"actor":"ci-root","admin":true},"ci-agent":{"actor":"ci-agent"}}'
        run: docker compose down -v --remove-orphans
      - name: Phase B mock-credential network isolation and operation preflight
        env:
          POSTGRES_PASSWORD: isolated_ci_test_password
          CONTINUITY_TOKENS_JSON: '{"phaseb-admin":{"actor":"root","admin":true},"phaseb-agent":{"actor":"phase-b-agent"}}'
          CONTINUITY_PHASE_B_ADMIN_BEARER: phaseb-admin
          CONTINUITY_PHASE_B_AGENT_BEARER: phaseb-agent
        run: |
          set -eu
          token_file=$(mktemp)
          key_file=$(mktemp)
          printf 'fake-not-a-real-github-token-for-offline-test-only' > "$token_file"
          python -c "import secrets; print(secrets.token_urlsafe(48))" > "$key_file"
          export CONTINUITY_PHASE_B_TOKEN_FILE="$token_file"
          export CONTINUITY_PHASE_B_EXECUTOR_KEY_FILE="$key_file"
          # These two credentials are invalid CI fixtures; allow the unprivileged
          # container to read their Docker bind-mounted secret files.
          chmod 644 "$token_file" "$key_file"
          trap 'docker compose -p continuity-phase-b -f compose.yaml -f compose.phase-b.yaml down -v --remove-orphans || true; rm -f "$token_file" "$key_file"' EXIT
          if ! docker compose -p continuity-phase-b -f compose.yaml -f compose.phase-b.yaml up --build -d --wait; then
            docker compose -p continuity-phase-b -f compose.yaml -f compose.phase-b.yaml logs --no-color trusted-executor
            exit 1
          fi
          docker compose -p continuity-phase-b -f compose.yaml -f compose.phase-b.yaml --profile isolation-test run --rm agent-isolation-probe
          python scripts/phase_b_prepare.py

      - name: Phase B one-command credential-free local offline preflight
        run: python scripts/phase_b_offline.py
