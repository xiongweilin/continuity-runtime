[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "continuity-runtime"
version = "0.1.0"
description = "Minimal cross-boundary state continuity and coordinated external effects"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
dbos = ["dbos>=2.31,<3", "httpx>=0.27,<1"]
github = ["httpx>=0.27,<1"]
[project.scripts]
continuity = "continuity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/continuity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
